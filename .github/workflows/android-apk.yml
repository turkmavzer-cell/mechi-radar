name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21   # Capacitor 7 -> JDK 21

      - name: Bağımlılıkları kur
        run: npm ci --no-audit --no-fund

      - name: Testler
        run: npm test

      - name: Web dosyalarını derle
        run: npm run build

      - name: Capacitor senkronize et
        run: npx cap sync android

      - name: APK derle
        working-directory: android
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      # İmza repodaki anahtarla aynı değilse derlemeyi durdur (güncelleme kurulamaz olurdu).
      - name: İmzayı doğrula
        run: |
          expected=$(keytool -list -v -keystore keystore/debug.keystore -storepass android -alias androiddebugkey | grep -m1 'SHA256:' | awk '{print $2}')
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          actual=$("$apksigner" verify --print-certs android/app/build/outputs/apk/debug/app-debug.apk | grep -m1 'SHA-256 digest' | awk '{print $NF}')
          echo "beklenen: $expected"
          echo "APK:      $actual"
          [ "$(echo "$expected" | tr -d ':' | tr 'A-F' 'a-f')" = "$actual" ] || { echo "İmza anahtarı farklı!"; exit 1; }

      - name: APK'yı adlandır
        run: cp android/app/build/outputs/apk/debug/app-debug.apk mechi-radar-${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: mechi-radar-apk-${{ github.run_number }}
          path: mechi-radar-${{ github.run_number }}.apk

      # Telefondan kolay indirmek için her derleme bir "Release" olarak da yayınlanır.
      - name: Release oluştur
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v1.0.${{ github.run_number }}" "mechi-radar-${{ github.run_number }}.apk" \
            --title "Mechi Radar 1.0.${{ github.run_number }}" \
            --notes "Otomatik derleme: ${{ github.sha }}" --latest

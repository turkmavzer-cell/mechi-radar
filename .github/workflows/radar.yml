name: Radar kontrol

# Her 5 dakikada izleme listesini kontrol eder, sinyal varsa mail atar.
# Sonuçlar "data" dalına yazılır; uygulama oradan okur.
on:
  schedule:
    - cron: '*/5 * * * *'
    # Pazar 03:17 UTC: data dalının geçmişini tek commit'e indir (repo şişmesin).
    - cron: '17 3 * * 0'
  workflow_dispatch:
    inputs:
      test_mail:
        description: 'Test maili gönder'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: radar
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Bağımlılıkları kur
        run: npm ci --omit=dev --no-audit --no-fund

      - name: Data dalını hazırla
        run: |
          git config --global user.name "mechi-radar-bot"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin data >/dev/null; then
            git fetch --depth=50 origin data
            git worktree add -B data data-branch FETCH_HEAD
          else
            git worktree add --orphan -b data data-branch
          fi

      - name: Kontrol et
        env:
          DATA_DIR: data-branch
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          TEST_MAIL: ${{ inputs.test_mail && '1' || '0' }}
        run: npm run radar

      - name: Sonuçları kaydet
        working-directory: data-branch
        run: |
          git add -A
          if git diff --cached --quiet; then echo "Değişiklik yok"; exit 0; fi
          git commit -q -m "radar $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3 4; do
            if git push origin HEAD:data; then exit 0; fi
            # Uygulama bu arada config.json yazmış olabilir: üstüne al ve tekrar dene.
            git fetch --depth=50 origin data
            git rebase FETCH_HEAD || { git rebase --abort; echo "rebase başarısız"; exit 1; }
            sleep $((i * 2))
          done
          exit 1

      - name: Data geçmişini sıkıştır (haftalık)
        if: github.event.schedule == '17 3 * * 0'
        working-directory: data-branch
        run: |
          git fetch --depth=1 origin data
          git checkout -q --detach FETCH_HEAD
          tip=$(git rev-parse HEAD)
          new=$(git commit-tree "HEAD^{tree}" -m "data: geçmiş sıkıştırıldı $(date -u +%F)")
          git push --force-with-lease=data:$tip origin $new:refs/heads/data || echo "Sıkıştırma bu hafta atlandı"
